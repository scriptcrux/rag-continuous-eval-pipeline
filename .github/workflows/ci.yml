name: CI - RAG Testing & Ragas Evaluation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Unit & Integration Tests (pytest)
      run: |
        pytest -v --strict-markers -ra

    - name: Run Ragas Benchmark Quality Gate Suite
      run: |
        python -m evaluation.run_eval --provider mock --strict

    - name: Upload Evaluation Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ragas-evaluation-scorecard
        path: evaluation/artifacts/

