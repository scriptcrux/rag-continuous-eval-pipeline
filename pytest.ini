[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers -ra
markers =
    unit: Fast isolated unit tests
    integration: REST API and end-to-end integration tests
    eval: Ragas benchmark evaluation and quality gate tests
    slow: Long-running or model-invoking tests
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning

